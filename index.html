<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060302">
<title>Jean</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas orb, header on top, dock at the bottom, glass panels (chat / tools / settings) that the orb re-centres around. Single dark holographic look. */
:root{
  --bg:#060302;--txt:#f3e8db;--dim:#a99580;--accent:#ff8a2a;--pri:#ff7a1a;--warn:#ff4a3a;--ok:#7ddc9b;
  --glass:rgba(16,11,7,.82);
  --line:color-mix(in srgb,var(--accent) 24%,transparent);
  --line2:color-mix(in srgb,var(--accent) 45%,transparent);
  --a06:color-mix(in srgb,var(--accent) 6%,transparent);
  --a10:color-mix(in srgb,var(--accent) 11%,transparent);
  --a20:color-mix(in srgb,var(--accent) 22%,transparent);
  --fd:'Chakra Petch','Rajdhani',system-ui,sans-serif;
  --fb:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --dockH:96px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 var(--fb);padding-block:0;padding-left:var(--gl);padding-right:var(--gr);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{position:relative;height:100%;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));overflow:hidden;isolation:isolate}
#bg{position:absolute;inset:0;z-index:-2}
#stars{position:absolute;left:0;top:0;width:1px;height:1px;z-index:-1}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.45}
#orb{position:absolute;inset:0;width:100%;height:100%;z-index:0;cursor:pointer;touch-action:manipulation}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:14px var(--gr) 8px var(--gl);pointer-events:none}
.top>*{pointer-events:auto}
.nm{font:600 18px var(--fd);letter-spacing:.34em;text-transform:uppercase}
.st{display:flex;align-items:center;gap:8px;margin-top:4px;font:500 11px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
#app[data-s=error] .dot{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.tr{display:flex;align-items:center;gap:12px}
.clk{text-align:right;font:500 11px var(--fm);letter-spacing:.08em;color:var(--dim)}
.clk b{display:block;font-weight:500;font-size:16px;letter-spacing:.1em;color:var(--txt);font-variant-numeric:tabular-nums}
.compact .clk span{display:none}

.hud{position:absolute;z-index:2;pointer-events:none;font:400 10px/1.8 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 70%,#fff 0%);opacity:.7;display:none;font-variant-numeric:tabular-nums}
.hud i{font-style:normal;color:var(--dim);display:inline-block;min-width:92px}
.hud.r{text-align:right}.hud.r i{min-width:0;margin-right:8px}

.cap{position:absolute;z-index:4;text-align:center;padding:0 16px;pointer-events:none}
.cap .in{max-width:640px;margin:0 auto;pointer-events:auto}
.cap small{display:block;margin-bottom:5px;font:500 11px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.cap p{margin:0;font:400 15px/1.55 var(--fb);text-shadow:0 0 18px #000,0 0 6px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.cap .btn{margin-top:8px}
#app[data-s=error] .cap small{color:var(--warn)}

.dock{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:10px var(--gr) 14px var(--gl);background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}
.compose{order:2;flex:1 1 100%;max-width:760px;display:flex;align-items:flex-end;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.compose:focus-within{border-color:var(--line2)}
#inp{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--txt);font:16px/1.4 var(--fb);padding:12px 6px;max-height:112px}
#inp::placeholder{color:var(--dim)}
.circ{width:48px;height:48px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--a10);color:var(--accent);cursor:pointer}
.circ:hover{background:var(--a20)}
.circ[aria-disabled=true]{opacity:.45}
.circ.live{background:var(--accent);color:#140a02;animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.nav{order:1;flex:1 1 100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:760px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 8px;border:1px solid var(--line);background:var(--glass);border-radius:22px;font:500 10px var(--fm);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib:hover{border-color:var(--line2)}
.ib[aria-pressed=true]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 16px -4px var(--accent)}
.ib.sq{padding:0;width:44px}
.compact .lb{display:none}
@media(min-width:900px){
  .dock{flex-wrap:nowrap}
  .compose{order:1;flex:1 1 auto}
  .nav{order:2;flex:none;display:flex;max-width:none}
  .lb{display:none}
}

.panel{position:absolute;z-index:7;display:none;flex-direction:column;min-height:0;background:var(--glass);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px -20px #000}
.panel.open{display:flex;animation:pin .26s ease}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.ph h2{flex:1;margin:0;font:600 13px var(--fd);letter-spacing:.22em;text-transform:uppercase}
.sb{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid transparent;background:none;color:var(--dim);cursor:pointer}
.sb:hover{color:var(--txt);border-color:var(--line)}
.pb{flex:1;min-height:0;overflow:auto;padding:14px 16px;overscroll-behavior:contain}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.tab{flex:none;padding:8px 11px;border-radius:14px;border:1px solid transparent;background:none;color:var(--dim);font:500 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--line2);background:var(--a06)}

.msg{margin:0 0 14px;max-width:94%}
.msg.u{margin-left:auto;text-align:right}
.who{font:500 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.bub{display:inline-block;text-align:left;padding:10px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);overflow-wrap:anywhere;max-width:100%}
.u .bub{background:var(--a10);border-color:var(--line2)}
.s .bub{border-color:var(--warn);color:#ffb8b0;background:rgba(255,74,58,.08)}
.bub p{margin:0 0 .6em}.bub p:last-child{margin:0}
.bub ul{margin:0 0 .6em;padding-left:1.2em}.bub ul:last-child{margin:0}
.acts{display:flex;gap:2px;margin-top:3px}
.u .acts{justify-content:flex-end}
.acts button{width:32px;height:32px;border:0;background:none;color:var(--dim);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.acts button:hover{color:var(--accent);background:var(--a06)}
.acts .ic{width:16px;height:16px}
.intro p{margin:0 0 12px;color:var(--txt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--a06);color:var(--txt);font:13px var(--fb);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.hist{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;padding:6px}
.hist .hi{display:flex;align-items:center;gap:6px}
.hist .hi button.t{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px var(--fb)}
.hist .hi button.t:hover{color:var(--accent)}

h3{margin:20px 0 4px;font:500 11px var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h3:first-child{margin-top:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--a06)}
.row label{flex:1;min-width:0}
.hint,.note{display:block;color:var(--dim);font-size:12px;line-height:1.45}
.note{margin:8px 0}
.rg{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.rg input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.rg output{font:500 12px var(--fm);color:var(--accent);font-variant-numeric:tabular-nums}
.fld{padding:8px 0}
.fld label{display:block;margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea.f{width:100%;min-height:40px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);font:14px var(--fb)}
textarea.f{resize:vertical;min-height:80px}
select{width:auto;max-width:58%}
input:focus,select:focus,textarea.f:focus{border-color:var(--accent);outline:0}
input[type=color]{width:54px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.4);cursor:pointer}
input.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#241a10;border:1px solid var(--line);position:relative;cursor:pointer;flex:none;margin:0}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:left .2s,background .2s}
input.sw:checked{background:var(--a20);border-color:var(--accent)}
input.sw:checked::after{left:21px;background:var(--accent)}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--a06);font:500 12px var(--fm);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:var(--a20)}
.btn.pri{background:var(--accent);color:#140a02;border-color:var(--accent)}
.btn.dan{border-color:var(--warn);color:var(--warn);background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:11px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.thm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--a06)}
.thm span:first-child{min-width:0;overflow-wrap:anywhere}
.thm .g{display:flex;gap:6px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--dim);font:500 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
pre.sys{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--fm);color:var(--dim);margin:8px 0 0}
details summary{cursor:pointer;color:var(--accent);font:500 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:6px 0}
.sum{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--a06);font-size:13px}
.sum ul{margin:4px 0 0;padding-left:1.1em}

.big{font:500 44px var(--fm);letter-spacing:.04em;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.center{text-align:center}.dim{color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kp button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);font:500 18px var(--fm);cursor:pointer}
.kp button:hover{border-color:var(--line2)}
.kp button.op{color:var(--accent)}
.kp button.eq{background:var(--accent);color:#140a02;border-color:var(--accent)}
.cres{min-height:28px;text-align:right;font:500 20px var(--fm);color:var(--accent);margin:6px 2px;overflow-wrap:anywhere}
.lap{display:flex;justify-content:space-between;font:13px var(--fm);padding:6px 0;border-bottom:1px solid var(--a06);font-variant-numeric:tabular-nums}
.nchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.nchips .chip{flex:none;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nchips .chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
textarea.nt{width:100%;min-height:200px;resize:vertical;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);font:14px/1.55 var(--fb)}
textarea.nt:focus{border-color:var(--accent);outline:0}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH) + 14px);z-index:20;max-width:calc(100% - 32px);padding:9px 14px;border-radius:12px;background:rgba(20,14,8,.96);border:1px solid var(--line2);font:12px/1.4 var(--fm);text-align:center}
.modal{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.66)}
.modal.open{display:flex}
.mbox{width:min(360px,calc(100% - 32px));padding:20px;border-radius:16px;background:#120d08;border:1px solid var(--line2)}
.mbox p{margin:0 0 16px}
.mbox .btns{justify-content:flex-end;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="i-tools" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 4v16M15 8v8M19 10v4"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-say" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
<symbol id="i-mem" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
</svg>

<div id="app" data-s="idle">
  <div id="bg"></div><div id="stars"></div>
  <canvas id="orb" aria-label="Holographic orb. Tap to talk."></canvas>

  <header class="top" id="top">
    <div>
      <div class="nm" id="nm">Jean</div>
      <div class="st"><span class="dot"></span><span id="stt">Standing by</span></div>
    </div>
    <div class="tr">
      <button class="ib sq" id="vq" title="Voice settings" aria-label="Voice settings"><svg class="ic"><use href="#i-say"/></svg></button>
      <button class="ib sq" id="fs" title="Fullscreen" aria-label="Fullscreen"><svg class="ic"><use href="#i-fs"/></svg></button>
      <div class="clk"><b id="clkT">--:--</b><span id="clkD"></span></div>
    </div>
  </header>

  <div class="hud l" id="hudL"></div>
  <div class="hud r" id="hudR"></div>

  <div class="cap" id="cap"><div class="in">
    <small id="capL"></small>
    <p id="capT" title="Open conversation"></p>
    <button class="btn sm" id="capRetry" hidden>Retry</button>
  </div></div>

  <section class="panel" id="chat" aria-label="Conversation">
    <div class="ph"><h2>Conversation</h2>
      <button class="sb" data-a="hist" title="Past conversations" aria-label="Past conversations"><svg class="ic"><use href="#i-hist"/></svg></button>
      <button class="sb" data-a="new" title="New conversation" aria-label="New conversation"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="sb" data-a="clear" title="Clear conversation" aria-label="Clear conversation"><svg class="ic"><use href="#i-trash"/></svg></button>
      <button class="sb" data-a="close" title="Close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="pb" id="cbody"></div>
  </section>

  <section class="panel" id="tools" aria-label="Quick commands">
    <div class="ph"><h2>Quick commands</h2><button class="sb" data-a="close" title="Close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="tabs" id="ttabs" role="tablist"></div>
    <div class="pb" id="tbody"></div>
  </section>

  <section class="panel" id="settings" aria-label="Settings">
    <div class="ph"><h2>Settings</h2><button class="sb" data-a="close" title="Close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="tabs" id="stabs" role="tablist"></div>
    <div class="pb" id="sbody"></div>
  </section>

  <footer class="dock" id="dock">
    <div class="compose">
      <button class="circ" id="mic" aria-label="Microphone"><svg class="ic"><use href="#i-mic"/></svg></button>
      <textarea id="inp" rows="1" placeholder="Speak or type…" enterkeyhint="send" aria-label="Message"></textarea>
      <button class="circ" id="send" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
    </div>
    <nav class="nav">
      <button class="ib" id="bConv" aria-pressed="false" title="Hands-free listening (Alt+V)"><svg class="ic"><use href="#i-wave"/></svg><span class="lb">Auto</span></button>
      <button class="ib" id="bChat" aria-pressed="false" title="Chat (Alt+C)"><svg class="ic"><use href="#i-chat"/></svg><span class="lb">Chat</span></button>
      <button class="ib" id="bTools" aria-pressed="false" title="Tools (Alt+T)"><svg class="ic"><use href="#i-tools"/></svg><span class="lb">Tools</span></button>
      <button class="ib" id="bSet" aria-pressed="false" title="Settings (Alt+S)"><svg class="ic"><use href="#i-set"/></svg><span class="lb">Setup</span></button>
    </nav>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox"><p id="mmsg"></p><div class="btns"><button class="btn" id="mno">Cancel</button><button class="btn pri" id="mok">Confirm</button></div></div></div>
</div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

  if(!synth||!S.voice.on)return false;stopSpeech();
  const raw=cleanSpeech(text).match(/[^.!?]+[.!?]*\s*/g)||[];const chunks=[];let cur='';
  for(const s of raw){if((cur+s).length>220&&cur){chunks.push(cur);cur=s}else cur+=s}if(cur)chunks.push(cur);

  const tok=++speakTok;let i=0;mic.spoken=new Set(normW(cleanSpeech(text)).split(' '));mic.followUntil=0;flags.tts=true;refresh();
  const next=()=>{if(tok!==speakTok)return;if(i>=chunks.length){flags.tts=false;refresh();afterSpeech();return}
    const u=new SpeechSynthesisUtterance(chunks[i++]);const v=voices.find(x=>x.name===S.voice.name);if(v){u.voice=v;u.lang=v.lang}

}

let dict=null,sampleFn=null;
const mic={on:false,awake:false,oneShot:false,buf:'',part:'',gapT:0,sleepT:0,restartT:0,userStop:false,followUntil:0,echoUntil:0,spoken:new Set()};
const normW=s=>s.toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function syncListen(){flags.listening=mic.on&&mic.awake;refresh()}
function isEcho(t){
  if(!(flags.tts||Date.now()<mic.echoUntil)||!mic.spoken.size)return false;

  const wk=findWake(t);if(wk&&w.length<=2)return false;

  return w.length>=2?hit/w.length>=.7:(hit===1&&!wk)}
function armSleep(){clearTimeout(mic.sleepT);mic.sleepT=setTimeout(()=>{if(!(mic.awake&&!mic.buf&&!mic.part))return;if(mic.oneShot){stopListening();return}mic.awake=false;syncListen();idleCaption()},7000)}

}

/* ---------- Gemini (direct from the browser, key stays in this browser) ---------- */
function sseText(block){
  let out='',blocked='',fin='';
  for(const line of block.split(/\r?\n/)){
    if(!line.startsWith('data:'))continue;
    const d=line.slice(5).trim();if(!d||d==='[DONE]')continue;
    let j;try{j=JSON.parse(d)}catch(e){continue}
    if(j.promptFeedback&&j.promptFeedback.blockReason)blocked=j.promptFeedback.blockReason;
    const c=j.candidates&&j.candidates[0];if(!c)continue;
    if(c.finishReason&&c.finishReason!=='STOP'&&c.finishReason!=='MAX_TOKENS')fin=c.finishReason;
    const ps=c.content&&c.content.parts;if(ps)for(const p of ps)if(p.text&&!p.thought)out+=p.text}
  return{out,blocked,fin}}
async function geminiOnce(input,opts,forceModel){
  const key=String((S.ai&&S.ai.key)||'').trim();
  if(!key)throw{code:'no_key',message:'Add your Gemini API key in Settings, under AI.'};
  const model=String(forceModel||S.ai.model||'gemini-2.5-flash-lite').trim().replace(/^models\//,'');
  const contents=input.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  let res;
  try{res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse',{method:'POST',signal:opts&&opts.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents})})}
  catch(e){if(e&&e.name==='AbortError')throw e;throw{code:'network',message:'Could not reach Google ('+((e&&e.message)||'network error')+'). Check your connection, and that no extension, VPN or firewall blocks generativelanguage.googleapis.com.'}}
  if(!res.ok){
    let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||''}catch(e){}
    if(res.status===429)throw{code:'rate_limited',message:model+' is out of free quota or rate-limited'+(msg?' ('+msg.slice(0,140)+')':'.')};
    if(res.status===503||res.status===500||res.status===502||res.status===504)throw{code:'overloaded',message:model+' is overloaded right now'+(msg?' ('+msg.slice(0,140)+')':'.')};
    if(res.status===400&&/api key/i.test(msg)||res.status===401||res.status===403)throw{code:'bad_key',message:'Gemini rejected the API key'+(msg?' ('+msg+')':'')+'. Check it in Settings, under AI.'};
    if(res.status===404)throw{code:'bad_model',message:'Gemini does not know the model “'+model+'”. Pick another in Settings, under AI.'};
    throw{code:'http',message:'Gemini returned an error ('+res.status+')'+(msg?': '+msg:'.')}}
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='',blocked='',fin='';
  const take=b=>{const r=sseText(b);if(r.blocked)blocked=r.blocked;if(r.fin)fin=r.fin;if(r.out){text+=r.out;if(opts&&opts.onText)opts.onText({text})}};
  for(;;){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let m;while((m=/\r?\n\r?\n/.exec(buf))){take(buf.slice(0,m.index));buf=buf.slice(m.index+m[0].length)}}
  if(buf.trim())take(buf);
  if(!text){if(blocked)throw{code:'blocked',message:'Gemini declined to answer ('+blocked+').'};if(fin)throw{code:'blocked',message:'Gemini stopped without an answer ('+fin+').'};throw{code:'empty',message:'Gemini returned an empty reply.'}}
  return{text,truncated:false}}
function rankModels(names){
  const ok=names.filter(n=>/^gemini/.test(n)&&!/(image|tts|live|embed|audio|robotics|computer|learnlm|vision|-pro|preview|exp|thinking)/i.test(n));
  const score=n=>{const v=/gemini-(\d+(?:\.\d+)?)/.exec(n);return(/lite/.test(n)?30:0)+(/flash/.test(n)?20:0)+(v?Math.min(parseFloat(v[1]),9):0)-(/latest/.test(n)?1:0)};
  const out=ok.sort((a,b)=>score(b)-score(a));
  const gem=names.filter(n=>/^gemma/.test(n)&&!/(embed|vision)/i.test(n)).sort().reverse();
  return out.concat(gem)}
const pickModel=names=>rankModels(names)[0]||null;
async function listModels(key){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100',{headers:{'x-goog-api-key':key}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:'http',message:'Google replied '+r.status+': '+((j.error&&j.error.message)||'no details')};
  return(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))}
let modelCache=null;
async function geminiCall(input,opts){
  const cur=String(S.ai.model||'').trim().replace(/^models\//,'');
  const retryable=e=>e&&(e.code==='bad_model'||e.code==='rate_limited'||e.code==='overloaded');
  const tried=[];let lastErr=null;
  const attempt=async m=>{tried.push(m);const r=await geminiOnce(input,opts,m);if(m!==cur){S.ai.model=m;save();toast('Using '+m+' because '+cur+' was unavailable.',4800);if(P.settings.open&&sTab==='ai')renderSettings(true)}return r};
  if(cur){try{return await attempt(cur)}catch(e){if(!retryable(e))throw e;lastErr=e}}
  if(!modelCache){try{modelCache=await listModels(String(S.ai.key).trim())}catch(e){throw lastErr||e}}
  const queue=rankModels(modelCache).filter(m=>!tried.includes(m)).slice(0,5);
  for(const m of queue){
    if(opts&&opts.signal&&opts.signal.aborted)throw{name:'AbortError'};
    try{return await attempt(m)}catch(e){if(!retryable(e))throw e;lastErr=e}}
  throw{code:lastErr&&lastErr.code||'overloaded',message:'No free model answered. '+(lastErr?lastErr.message+' ':'')+'Tried: '+tried.join(', ')+'. Wait a minute and retry, or pick a model in Settings, under AI.'}}

/* ---------- browser speech recognition ---------- */
function makeDict(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,active=false,pf=()=>{},ff=()=>{},sf=()=>{};
  return{
    start(){return new Promise((res,rej)=>{
      if(active){res();return}
      rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=navigator.language||'en-US';rec.maxAlternatives=1;
      let denied=false;
      rec.onstart=()=>{active=true;sf({state:'listening'});res()};
      rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)ff({text:r[0].transcript});else pf({text:r[0].transcript})}};
      rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){denied=true;rej({code:'not_granted'})}};
      rec.onend=()=>{const was=active;active=false;if(denied)return;if(was)sf({state:'idle',reason:'ended'})};
      try{rec.start()}catch(err){rej(err)}})},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()},
    onPartial(f){pf=f},onFinal(f){ff=f},onState(f){sf=f}}}

async function initCaps(){
  dict=makeDict();updateAI();
  if(dict){
    dict.onPartial(({text})=>heard(text,false));
    dict.onFinal(({text})=>heard(text,true));
    dict.onState(({state})=>{
      if(state==='listening'){mic.on=true;mic.userStop=false;clearTimeout(mic.restartT);mic.buf='';mic.part='';
        if(mic.oneShot){mic.awake=true;setCaption('Listening','Microphone is on. Speak, then pause and Jean will answer.');armSleep()}
        else{mic.awake=false;setCaption(S.id.name,'Hands-free is on. Say “'+S.id.wake+'”.')}
        syncListen();return}
      if(state!=='idle')return;
      const was=mic.on;mic.on=false;mic.awake=false;clearTimeout(mic.gapT);clearTimeout(mic.sleepT);syncListen();
      if(!was)return;
      if(!mic.oneShot&&S.voice.hands&&!mic.userStop){clearTimeout(mic.restartT);mic.restartT=setTimeout(tryRestart,450);setCaption(S.id.name,'Reconnecting the microphone…')}
      else idleCaption()});
  }

  if(P.settings.open)renderSettings(true);
}

      const rk=rankModels(all),names=rk.concat(all.filter(n=>/^gemini/.test(n)&&!rk.includes(n)));
      if(!names.length){say('The key works but lists no chat models.');return}
      if(box){box.textContent='Tap a model to use it. The first ones are small, stable models, which usually have the loosest free limits and the least demand. Google does not report free status, so Jean also switches on its own if one is overloaded.';const w=document.createElement('div');w.className='chips';w.style.marginTop='8px';names.slice(0,30).forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{S.ai.model=n;save();updateAI();renderSettings(true);const bx=$('#aiMsg');if(bx)bx.textContent='Model set to '+n+'. Press Test connection.'};w.append(b)});box.append(w)}
    }catch(e){say('Could not reach Google ('+((e&&e.message)||'network error')+'). If this says "Failed to fetch", something is blocking generativelanguage.googleapis.com: a VPN, firewall, ad-blocker or school/work network.')}
    return}
  if(a==='ai-clear'){S.ai.key='';save();updateAI();renderSettings(true);toast('Key removed.');return}
  if(a==='greet'){setCaption(S.id.name,greetText());if(!speak(greetText()))toast('Voice output is off or unavailable.');return}
  if(a==='fs')return toggleFs();
  if(a==='pace'){S.voice.rate=parseFloat(el.dataset.v);save();renderSettings(true);return}
  if(a==='voice-test'){speak('Systems nominal. This is '+S.id.name+'.');return}
  if(a==='voice-stop')return stopSpeech();
  if(a==='thm-save'){const n=($('#thmName').value||'').trim();if(!n)return toast('Give the theme a name first.');const d=JSON.parse(JSON.stringify({orb:S.orb,col:S.col,bgMode:S.bgMode}));const ex=S.themes.find(t=>t.name===n);if(ex)Object.assign(ex,d);else S.themes.push(Object.assign({id:uid(),name:n},d));save();renderSettings(true);toast('Theme saved.');return}
  if(a==='thm-load'){const t=S.themes.find(x=>x.id===id);if(t){Object.assign(S.orb,t.orb);Object.assign(S.col,t.col);S.bgMode=t.bgMode;applyAll();save();renderSettings(true);toast('Theme loaded.')}return}
  if(a==='thm-dup'){const t=S.themes.find(x=>x.id===id);if(t){S.themes.push(Object.assign(JSON.parse(JSON.stringify(t)),{id:uid(),name:t.name+' copy'}));save();renderSettings(true)}return}
  if(a==='thm-del'){const t=S.themes.find(x=>x.id===id);if(t&&await ask('Delete theme “'+t.name+'”?','Delete')){S.themes=S.themes.filter(x=>x.id!==id);save();renderSettings(true)}return}
  if(a==='look-reset'){if(await ask('Restore the default orb, colours and background?','Restore')){const d=DEFAULTS();S.orb=d.orb;S.col=d.col;S.bgMode=d.bgMode;S.ui.hud=d.ui.hud;S.ui.particles=d.ui.particles;S.ui.rings=d.ui.rings;applyAll();save();renderSettings(true)}return}
  if(a==='mem-add'){const i=$('#memNew'),v=i.value.trim();if(!v)return;S.mem.items.push({id:uid(),text:v,ts:Date.now()});save();renderSettings(true);return}
  if(a==='mem-del'){S.mem.items=S.mem.items.filter(x=>x.id!==id);save();renderSettings(true);return}
  if(a==='mem-clear'){if(await ask('Erase every saved memory item?','Erase')){S.mem.items=[];save();renderSettings(true)}return}
  if(a==='clr-chat'){if(await ask('Delete the current conversation and all past conversations?','Delete')){S.chat=[];S.history=[];ELS.clear();save();idleCaption();toast('Conversations cleared.')}return}
  if(a==='clr-notes'){if(await ask('Delete every note?','Delete')){S.notes=[];noteSel=null;save();toast('Notes cleared.')}return}
  if(a==='clr-mem'){if(await ask('Erase every saved memory item?','Erase')){S.mem.items=[];save();renderSettings(true);toast('Memory cleared.')}return}
  if(a==='reset'){if(await ask('Reset Jean? All settings, notes, memory and conversations will be erased.','Reset')){stopSpeech();try{localStorage.removeItem(KEY)}catch(e){}S=DEFAULTS();ELS.clear();O.first=false;TM.run=false;SW.run=false;applyAll();renderSettings();idleCaption();toast('Jean has been reset.')}}
}
function toggleFs(){const el=document.documentElement;if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else if(el.requestFullscreen){el.requestFullscreen().catch(()=>toast('Fullscreen is not available here.'))}else toast('Fullscreen is not available here.')}

/* ---------- wiring ---------- */
function wire(){
  $('#send').addEventListener('click',()=>{if(ctl){ctl.abort()}else send()});
  $('#mic').addEventListener('click',toggleMic);
  const inp=$('#inp');inp.addEventListener('input',autosize);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
  $('#bChat').addEventListener('click',()=>openPanel('chat'));$('#bTools').addEventListener('click',()=>openPanel('tools'));$('#bSet').addEventListener('click',()=>openPanel('settings'));
  $('#bConv').addEventListener('click',toggleHands);
  $('#vq').addEventListener('click',()=>{sTab='voice';openPanel('settings',true);renderSettings()});$('#fs').addEventListener('click',toggleFs);if(!document.fullscreenEnabled)$('#fs').hidden=true;
  $('#capT').addEventListener('click',()=>openPanel('chat',true));
  $('#capRetry').addEventListener('click',()=>{if(lastErrRetry)ask_()});
  cv.addEventListener('click',()=>{if(!dict&&!(flags.tts||flags.stream||flags.thinking)){setCaption(S.id.name,greetText());speak(greetText());return}orbTap()});
  for(const id in P)P[id].el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.parentElement.classList.contains('ph')){if(id==='chat')chatAction(b.dataset.a);else openPanel(id,false)}});
  $('#cbody').addEventListener('click',e=>{
    const chip=e.target.closest('[data-p]');if(chip){send(chip.dataset.p);return}
    const h=e.target.closest('[data-h]');if(h){const x=S.history.find(y=>y.id===h.dataset.h);if(x){archiveChat();S.history=S.history.filter(y=>y.id!==x.id);S.chat=x.msgs;showHist=false;ELS.clear();save();renderChat();idleCaption()}return}
    const hd=e.target.closest('[data-hd]');if(hd){S.history=S.history.filter(y=>y.id!==hd.dataset.hd);save();renderChat();return}
    const a=e.target.closest('[data-a]');if(!a)return;const msg=a.closest('.msg'),m=S.chat.find(x=>x.id===msg.dataset.id);if(!m)return;
    if(a.dataset.a==='copy')copyText(m.content);
    else if(a.dataset.a==='say'){if(!speak(m.content))toast('Voice output is off or unavailable.')}
    else if(a.dataset.a==='mem'){if(!S.mem.on)return toast('Memory is turned off in settings.');S.mem.items.push({id:uid(),text:m.content.slice(0,300),ts:Date.now()});save();toast('Saved to memory.')}
  });
  $('#ttabs').addEventListener('click',e=>{const b=e.target.closest('[data-tt]');if(b){toolTab=b.dataset.tt;renderTools()}});
  $('#stabs').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(b){sTab=b.dataset.st;renderSettings();$('#sbody').scrollTop=0}});
  const sb=$('#sbody');
  sb.addEventListener('input',e=>{const t=e.target;if(t.dataset.mid){const m=S.mem.items.find(x=>x.id===t.dataset.mid);if(m){m.text=t.value;save()}return}if(!t.dataset.k||t.type==='checkbox'||t.tagName==='SELECT')return;onField(t)});
  sb.addEventListener('change',e=>{const t=e.target;if(t.dataset.k&&(t.type==='checkbox'||t.tagName==='SELECT'))onField(t)});
  sb.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)settingsAction(b.dataset.a,b)});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if($('#modal').classList.contains('open'))return;const open=['settings','tools','chat'].find(k=>P[k].open);if(open)openPanel(open,false);return}
    if(e.altKey&&!e.ctrlKey&&!e.metaKey){const m={KeyC:()=>openPanel('chat'),KeyT:()=>openPanel('tools'),KeyS:()=>openPanel('settings'),KeyM:toggleMic,KeyV:()=>$('#bConv').click()}[e.code];if(m){e.preventDefault();m()}return}
    if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();$('#inp').focus()}
  });
  new ResizeObserver(layout).observe($('#app'));
  try{new ResizeObserver(layout).observe($('#dock'))}catch(e){}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)last=performance.now()});
}

/* ---------- boot ---------- */
wire();applyAll();layout();idleCaption();refresh();autosize();
setInterval(tick,50);tick();
requestAnimationFrame(frame);
initCaps();
document.addEventListener('click',e=>{if(dict&&S.voice.hands&&!mic.on&&!mic.userStop&&!e.target.closest('#mic,#bConv,#cv,.modal'))startListening()},true);
setTimeout(loadVoices,700);setTimeout(loadVoices,2500);
})();
</script>
